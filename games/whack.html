<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>打地鼠</title>
<style>
:root{--blue:#2563eb}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Huninn","Noto Sans TC",system-ui,sans-serif;background:#e8f7ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;user-select:none}
#bar{font-weight:900;color:var(--blue);font-size:14px;display:flex;gap:16px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,330px);aspect-ratio:1/1}
.hole{position:relative;background:#caa472;border-radius:50%;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);cursor:pointer;display:grid;place-items:center}
.hole::after{content:"";position:absolute;bottom:0;left:0;right:0;height:40%;background:#8a6a44;border-radius:50% 50% 0 0}
.mole{position:relative;z-index:2;font-size:34px;transform:translateY(120%);transition:transform .12s}
.hole.up .mole{transform:translateY(8%)}
.hole.bonk .mole{transform:translateY(8%) scale(.8)}
button{font-family:inherit;font-weight:900;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:8px 18px;font-size:14px;cursor:pointer}
#over{position:fixed;inset:0;display:none;place-items:center;flex-direction:column;gap:10px;background:rgba(37,99,235,.92);color:#fff;font-weight:900;text-align:center}
#over.show{display:flex}
</style></head><body>
<div id="bar"><span>分數 <b id="sc">0</b></span><span>時間 <b id="tm">30</b>s</span></div>
<div id="grid"></div>
<button id="startBtn" onclick="start()">開始打地鼠！</button>
<div id="over"><div style="font-size:34px">🔨</div><div id="ot"></div><button onclick="start()">再玩一次</button></div>
<script>
var grid=document.getElementById('grid'),holes=[],sc=0,tm=30,playing=false,spawnT,tickT;
for(var i=0;i<9;i++){var h=document.createElement('div');h.className='hole';h.innerHTML='<span class="mole">🐹</span>';
 (function(h){h.onpointerdown=function(){if(playing&&h.classList.contains('up')&&!h.classList.contains('bonk')){h.classList.add('bonk');sc++;document.getElementById('sc').textContent=sc;setTimeout(function(){h.classList.remove('up','bonk')},120)}}})(h);
 grid.appendChild(h);holes.push(h);}
function start(){
  sc=0;tm=30;playing=true;document.getElementById('sc').textContent=0;document.getElementById('tm').textContent=30;
  document.getElementById('over').classList.remove('show');document.getElementById('startBtn').style.display='none';
  clearInterval(spawnT);clearInterval(tickT);
  spawnT=setInterval(pop,720);
  tickT=setInterval(function(){tm--;document.getElementById('tm').textContent=tm;if(tm<=0)end()},1000);
}
function pop(){
  var free=holes.filter(function(h){return !h.classList.contains('up')});
  if(!free.length)return;var h=free[Math.floor(Math.random()*free.length)];
  h.classList.add('up');setTimeout(function(){h.classList.remove('up','bonk')},700+Math.random()*300);
}
function end(){playing=false;clearInterval(spawnT);clearInterval(tickT);holes.forEach(function(h){h.classList.remove('up','bonk')});
  document.getElementById('ot').textContent='時間到！你打到 '+sc+' 隻地鼠';document.getElementById('over').classList.add('show');}
</script></body></html>
