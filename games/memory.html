<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>記憶配對</title>
<style>
:root{--blue:#2563eb}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Huninn","Noto Sans TC",system-ui,sans-serif;background:#eef4ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;user-select:none}
#bar{font-weight:900;color:var(--blue);font-size:14px;display:flex;gap:14px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(94vw,360px);aspect-ratio:4/3}
.card{position:relative;border-radius:14px;cursor:pointer;transform-style:preserve-3d;transition:transform .35s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;font-size:26px}
.back{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;font-size:20px}
.front{background:#fff;transform:rotateY(180deg);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card.done .front{background:#dcfce7}
button{font-family:inherit;font-weight:900;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:7px 16px;font-size:13px;cursor:pointer}
#win{position:fixed;inset:0;display:none;place-items:center;background:rgba(37,99,235,.92);color:#fff;text-align:center;flex-direction:column;gap:10px;font-weight:900}
#win.show{display:flex}
</style></head><body>
<div id="bar"><span>翻牌數 <b id="mv">0</b></span><span>配對 <b id="pr">0</b>/6</span></div>
<div id="grid"></div>
<div id="win"><div style="font-size:34px">🎉</div><div id="wt">全部配對成功！</div><button onclick="init()">再玩一次</button></div>
<script>
var EM=["🐙","🦄","🍕","🚀","🐱","🌈"],grid=document.getElementById('grid');
var first=null,lock=false,mv=0,pr=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function init(){
  mv=0;pr=0;first=null;lock=false;document.getElementById('mv').textContent=0;document.getElementById('pr').textContent=0;
  document.getElementById('win').classList.remove('show');grid.innerHTML='';
  var deck=shuffle(EM.concat(EM));
  deck.forEach(function(e){
    var c=document.createElement('div');c.className='card';c.dataset.e=e;
    c.innerHTML='<div class="face back">?</div><div class="face front">'+e+'</div>';
    c.onclick=function(){pick(c)};grid.appendChild(c);
  });
}
function pick(c){
  if(lock||c.classList.contains('flip')||c.classList.contains('done'))return;
  c.classList.add('flip');
  if(!first){first=c;return}
  mv++;document.getElementById('mv').textContent=mv;
  if(first.dataset.e===c.dataset.e){
    first.classList.add('done');c.classList.add('done');first=null;pr++;
    document.getElementById('pr').textContent=pr;
    if(pr===6){document.getElementById('wt').textContent='全部配對！只翻了 '+mv+' 次';setTimeout(function(){document.getElementById('win').classList.add('show')},450)}
  }else{
    lock=true;var a=first,b=c;first=null;
    setTimeout(function(){a.classList.remove('flip');b.classList.remove('flip');lock=false},700);
  }
}
init();
</script></body></html>
